<body>
<div class="bg"></div>
<div class="title">
  <div class="name">CrystalPilot</div>
  <div class="sub">Crystallographic data processing &amp; analysis</div>
</div>
<div class="foot">
  <div class="ver" id="ver">Starting&hellip;</div>
  <div class="credit"><b>Mikael Elias</b></div>
  <div class="status"><span class="dot"></span><span id="msg">Starting the CrystalPilot server</span></div>
  <div class="bar"><i></i></div>
  <div class="hint" id="hint">Starting Linux and the server. The first start after Windows boots takes up to a minute; later starts a few seconds.</div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var url = q.get('url') || 'http://localhost:8000';
  var t0 = Date.now(), msg = document.getElementById('msg'), ver = document.getElementById('ver'), hint = document.getElementById('hint');
  var done = false;
  // ?demo=0.6.2 : show the finished screen without a server (the manual's cover picture is rendered this way)
  var demo = q.get('demo');
  if (demo !== null) { ver.textContent = 'Version ' + demo; msg.textContent = 'Ready \u2014 opening the interface'; hint.style.display = 'none'; document.querySelector('.bar').style.display = 'none'; return; }
  function go(version){
    if (done) return; done = true;
    if (version) ver.textContent = 'Version ' + version;
    msg.textContent = 'Ready \u2014 opening the interface';
    setTimeout(function(){ location.replace(url); }, 400);
  }
  function waiting(){
    var s = Math.round((Date.now() - t0) / 1000);
    msg.textContent = 'Starting the CrystalPilot server (' + s + ' s)';
    if (s > 90) hint.textContent = 'Still waiting. Look at the CrystalPilot window for messages; if it closed, run CrystalPilot.bat again.';
    setTimeout(tick, 700);
  }
  function tick(){
    // This page is a local file, so the browser only lets it read the reply
    // when the server allows it (it does for /health).  If reading fails for
    // any reason, a no-cors probe still tells us whether the server answers:
    // it resolves when something is listening and rejects when nothing is.
    fetch(url + '/health', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      go(d.version || '');
    }).catch(function(){
      fetch(url + '/health', {cache:'no-store', mode:'no-cors'}).then(function(){ go(''); }).catch(waiting);
    });
  }
  tick();
  // Belt and braces: if the polling itself ever stalls, try the page directly.
  setTimeout(function(){ if (!done) { var i = new Image(); i.onload = function(){ go(''); }; i.src = url + '/assets/logo.jpg?' + Date.now(); } }, 20000);
})();
</script>
</body></html>
